openapi: 3.0.1
info:
  title: Inheritance-only parent schema test
  version: 1.0.0
paths:
  /test:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildPolymorphic'
components:
  schemas:
    Entity:
      type: object
      properties:
        '@type':
          type: string
    
    # Parent should NOT get a Polymorphic wrapper because it's never referenced directly
    # It's only used in allOf (inheritance)
    Parent:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            name:
              type: string
    
    # Child is left unchanged: its constraint goes on its ChildPolymorphic branch
    Child:
      allOf:
        - $ref: '#/components/schemas/Parent'
        - type: object
          properties:
            childProp:
              type: string

    # GrandChild extends Child - also unchanged, constrained on its branch
    GrandChild:
      allOf:
        - $ref: '#/components/schemas/Child'
        - type: object
          properties:
            grandChildProp:
              type: string

    # Sibling also inherits from Parent but has no discriminator
    Sibling:
      allOf:
        - $ref: '#/components/schemas/Parent'
        - type: object
          properties:
            siblingProp:
              type: number
    
    # ChildPolymorphic is the oneOf wrapper; each branch carries its constraint
    # (enum, because the document is OpenAPI 3.0.1)
    ChildPolymorphic:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/Child'
            - type: object
              properties:
                '@type':
                  enum:
                    - Child
        - allOf:
            - $ref: '#/components/schemas/GrandChild'
            - type: object
              properties:
                '@type':
                  enum:
                    - GrandChild
      discriminator:
        propertyName: '@type'
        mapping:
          Child: '#/components/schemas/Child'
          GrandChild: '#/components/schemas/GrandChild'
